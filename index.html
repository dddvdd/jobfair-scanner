<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Fair Check-In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

body {
  font-family: 'Inter', Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 16px;
  background: #111111;
  color: #f0f0f0;
}

#reader {
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
}

#result {
  margin-top: 20px;
  padding: 20px 24px;
  border-radius: 14px;
  font-size: 20px;
  font-weight: 700;
  min-height: 60px;
  display: none;
  border: 1px solid transparent;
  transition: background 0.25s ease, border-color 0.25s ease;
  letter-spacing: -0.01em;
}

.success {
  background: #1e7e34;
  border-color: #2ea44f;
}

.duplicate {
  background: #7a5000;
  border-color: #b8860b;
}

.invalid {
  background: #7a1020;
  border-color: #c0392b;
}

.idle {
  background: #1c1c1c;
  border-color: #333333;
  color: #aaaaaa;
}

#counter {
  margin: 12px auto 20px;
  font-size: 16px;
  font-weight: 700;
  background: #1a1a1a;
  border: 1px solid #252525;
  border-radius: 14px;
  padding: 14px 12px;
  max-width: 400px;
  display: flex;
  justify-content: space-around;
}

#counter span.label {
  color: #666666;
  font-weight: 400;
  font-size: 11px;
  display: block;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 2px;
}

.scanBtn {
  font-family: 'Inter', Arial, sans-serif;
  font-size: 16px;
  font-weight: 600;
  padding: 16px 20px;
  margin: 8px auto;
  display: block;
  width: 100%;
  max-width: 400px;
  color: #ffffff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: filter 0.15s ease, transform 0.1s ease;
  letter-spacing: -0.01em;
}

.scanBtn:hover {
  filter: brightness(1.12);
}

.scanBtn:active {
  transform: scale(0.98);
}

#startBtn {
  background: #0b6efd;
  box-shadow: 0 4px 24px rgba(11, 110, 253, 0.25);
}

#hotsBtn {
  background: #d4820a;
  box-shadow: 0 4px 24px rgba(212, 130, 10, 0.22);
}

#backBtn {
  font-family: 'Inter', Arial, sans-serif;
  font-size: 14px;
  font-weight: 500;
  padding: 10px 20px;
  margin: 16px auto;
  display: none;
  background: #222222;
  color: #aaaaaa;
  border: 1px solid #333333;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

#backBtn:hover {
  background: #2a2a2a;
  color: #f0f0f0;
}

#errorMsg {
  color: #ff8080;
  margin-top: 12px;
  font-size: 14px;
  display: none;
}

#modeLabel {
  font-size: 12px;
  color: #555555;
  margin-top: 8px;
  display: none;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
</style>
</head>
<body>
  <h2>Job Fair Check-In</h2>

  <div id="counter">
    <div><span id="checkedInCount">0</span><span class="label">Checked In</span></div>
    <div><span id="hotsCount">0</span><span class="label">HOTS</span></div>
  </div>

  <button id="startBtn" class="scanBtn" onclick="startScanner('checkin')">📷 Scan to Register Jobseeker</button>
  <button id="hotsBtn" class="scanBtn" onclick="startScanner('hots')">⭐ Scan to Record HOTS</button>

  <div id="modeLabel"></div>
  <div id="reader"></div>
  <div id="result" class="idle">Point camera at QR code</div>
  <button id="backBtn" onclick="stopScanner()">⬅ Back</button>
  <div id="errorMsg"></div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    // ====== EDIT THIS LINE with your Apps Script Web App URL ======
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyG_HJ3UkhAShl67R5FrVFKhwB-2ShAjknjqDODiRQ9ET7olE-JmvAD7BkMTGh9syPX/exec';

    let isProcessing = false;
    let html5QrCode;
    let currentMode = null;
    let jsonpCounter = 0;

    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('errorMsg');
    const startBtn = document.getElementById('startBtn');
    const hotsBtn = document.getElementById('hotsBtn');
    const backBtn = document.getElementById('backBtn');
    const modeLabel = document.getElementById('modeLabel');

    // ---- Generic JSONP request (bypasses CORS entirely via <script> tag) ----
    function jsonpGet(params, onDone) {
      const callbackName = 'jsonpCallback_' + (jsonpCounter++);
      const script = document.createElement('script');

      window[callbackName] = function(data) {
        onDone(data);
        delete window[callbackName];
        script.remove();
      };
      script.onerror = function() {
        onDone({ status: 'error', message: 'Network error' });
        delete window[callbackName];
        script.remove();
      };

      const query = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
      script.src = APPS_SCRIPT_URL + '?' + query + '&callback=' + callbackName;
      document.body.appendChild(script);
    }

    // ---- Live counter ----
    function refreshStats() {
      jsonpGet({ action: 'stats' }, (data) => {
        if (data.status === 'success') {
          document.getElementById('checkedInCount').textContent = data.checkedIn;
          document.getElementById('hotsCount').textContent = data.hots;
        }
      });
    }
    refreshStats(); // load counts on page open

    // ---- Starting a scan session (either mode) ----
    function startScanner(mode) {
      currentMode = mode;
      errorDiv.style.display = 'none';
      startBtn.style.display = 'none';
      hotsBtn.style.display = 'none';

      modeLabel.style.display = 'block';
      modeLabel.textContent = mode === 'hots' ? 'Mode: HOTS Registration' : 'Mode: Check-In';

      html5QrCode = new Html5Qrcode("reader");

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
      ).then(() => {
        resultDiv.style.display = 'block';
        backBtn.style.display = 'inline-block';
      }).catch(() => {
        Html5Qrcode.getCameras().then(devices => {
          if (devices && devices.length) {
            const backCam = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[devices.length - 1];
            html5QrCode.start(backCam.id, { fps: 10, qrbox: 250 }, onScanSuccess)
              .then(() => { resultDiv.style.display = 'block'; backBtn.style.display = 'inline-block'; })
              .catch(err2 => showError(err2));
          } else {
            showError('No camera found on this device.');
          }
        }).catch(err3 => showError(err3));
      });
    }

    // ---- Back button: cleanly release the camera and return to the menu ----
    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          resetToMenu();
        }).catch(() => {
          resetToMenu(); // even if stop() errors, still return the UI to the menu
        });
      } else {
        resetToMenu();
      }
    }

    function resetToMenu() {
      startBtn.style.display = 'block';
      hotsBtn.style.display = 'block';
      backBtn.style.display = 'none';
      resultDiv.style.display = 'none';
      modeLabel.style.display = 'none';
      currentMode = null;
    }

    function showError(err) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'Camera error: ' + (err.message || err) +
        '. Make sure you tapped "Allow" on the camera prompt.';
      resetToMenu();
    }

    // ---- Handling a successful QR read ----
    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      resultDiv.className = 'idle';
      resultDiv.textContent = 'Checking...';

      const action = currentMode === 'hots' ? 'hots' : 'checkin';
      jsonpGet({ action: action, id: decodedText }, (res) => {
        handleResult(res);
        refreshStats();
      });
    }

function handleResult(res) {
      if (res.status === 'success') {
        if (navigator.vibrate) navigator.vibrate(200);
        resultDiv.className = 'success';
        resultDiv.innerHTML = '✅<br>' + res.name + '<br><span style="font-size:16px">' +
          (currentMode === 'hots' ? 'Registered HOTS' : 'Checked In') + ' — ' + res.time + '</span>';
      } else if (res.status === 'duplicate') {
        if (navigator.vibrate) navigator.vibrate([100, 100, 100]);
        resultDiv.className = 'duplicate';
        resultDiv.innerHTML = '⚠️<br>' + res.name + '<br><span style="font-size:16px">Already recorded — ' + res.time + '</span>';
      } else if (res.status === 'not_checked_in') {
        if (navigator.vibrate) navigator.vibrate([150, 100, 150, 100, 150]); // distinct pattern
        resultDiv.className = 'invalid';
        resultDiv.innerHTML = '🚫<br>' + res.name + '<br><span style="font-size:16px">Not checked in yet — send to Check-In first</span>';
      } else if (res.status === 'error') {
        if (navigator.vibrate) navigator.vibrate(500);
        resultDiv.className = 'invalid';
        resultDiv.innerHTML = '⚠️ System Error<br><span style="font-size:14px">' + res.message + '</span>';
      } else {
        if (navigator.vibrate) navigator.vibrate(500);
        resultDiv.className = 'invalid';
        resultDiv.innerHTML = '❌<br>Invalid Ticket';
      }
      setTimeout(() => {
        isProcessing = false;
        resultDiv.className = 'idle';
        resultDiv.textContent = 'Point camera at QR code';
      }, 2500);
    }
  </script>
</body>
</html>
