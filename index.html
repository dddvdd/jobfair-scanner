<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Fair Check-In</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 16px; background: #111; color: #fff; }
  #reader { width: 100%; max-width: 400px; margin: 0 auto; }
  #result { margin-top: 20px; padding: 20px; border-radius: 12px; font-size: 20px; font-weight: bold; min-height: 60px; display: none; }
  .success { background: #1e7e34; }
  .duplicate { background: #b8860b; }
  .invalid { background: #a71d2a; }
  .idle { background: #333; }
  #startBtn {
    font-size: 22px; padding: 16px 32px; margin: 20px auto; display: block;
    background: #0b6efd; color: #fff; border: none; border-radius: 10px;
  }
  #errorMsg { color: #ff8080; margin-top: 12px; font-size: 14px; display: none; }
</style>
</head>
<body>
  <h2>Job Fair Check-In</h2>
  <button id="startBtn" onclick="startScanner()">📷 Start Scanning</button>
  <div id="reader"></div>
  <div id="result" class="idle">Point camera at QR code</div>
  <div id="errorMsg"></div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    // ====== EDIT THIS LINE with your Apps Script Web App URL ======
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyG_HJ3UkhAShl67R5FrVFKhwB-2ShAjknjqDODiRQ9ET7olE-JmvAD7BkMTGh9syPX/exec';

    let isProcessing = false;
    let html5QrCode;
    let jsonpCounter = 0;
    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('errorMsg');
    const startBtn = document.getElementById('startBtn');

    function startScanner() {
      errorDiv.style.display = 'none';
      startBtn.textContent = 'Starting camera...';
      html5QrCode = new Html5Qrcode("reader");

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
      ).then(() => {
        startBtn.style.display = 'none';
        resultDiv.style.display = 'block';
      }).catch(() => {
        Html5Qrcode.getCameras().then(devices => {
          if (devices && devices.length) {
            const backCam = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[devices.length - 1];
            html5QrCode.start(backCam.id, { fps: 10, qrbox: 250 }, onScanSuccess)
              .then(() => { startBtn.style.display = 'none'; resultDiv.style.display = 'block'; })
              .catch(err2 => showError(err2));
          } else {
            showError('No camera found on this device.');
          }
        }).catch(err3 => showError(err3));
      });
    }

    function showError(err) {
      startBtn.textContent = '📷 Start Scanning';
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'Camera error: ' + (err.message || err) +
        '. Make sure you tapped "Allow" on the camera prompt, and that camera access is enabled for this site in your phone browser settings.';
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      resultDiv.className = 'idle';
      resultDiv.textContent = 'Checking...';
      jsonpRequest(decodedText);
    }

    function jsonpRequest(scannedId) {
      const callbackName = 'jsonpCallback_' + (jsonpCounter++);
      const script = document.createElement('script');

      window[callbackName] = function(data) {
        handleResult(data);
        delete window[callbackName];
        script.remove();
      };

      script.onerror = function() {
        resultDiv.className = 'invalid';
        resultDiv.textContent = 'Network error - check internet connection';
        setTimeout(() => { isProcessing = false; }, 2000);
        delete window[callbackName];
        script.remove();
      };

      script.src = APPS_SCRIPT_URL + '?action=checkin&id=' + encodeURIComponent(scannedId) + '&callback=' + callbackName;
      document.body.appendChild(script);
    }

function handleResult(res) {
      if (res.status === 'success') {
        if (navigator.vibrate) navigator.vibrate(200); // single buzz = success
        resultDiv.className = 'success';
        resultDiv.innerHTML = '✅<br>' + res.name + '<br><span style="font-size:16px">Checked In — ' + res.time + '</span>';
      } else if (res.status === 'duplicate') {
        if (navigator.vibrate) navigator.vibrate([100, 100, 100]); // triple buzz = warning
        resultDiv.className = 'duplicate';
        resultDiv.innerHTML = '⚠️<br>' + res.name + '<br><span style="font-size:16px">Already checked in at ' + res.time + '</span>';
      } else {
        if (navigator.vibrate) navigator.vibrate(500); // long buzz = error
        resultDiv.className = 'invalid';
        resultDiv.innerHTML = '❌<br>Invalid Ticket';
      }
      setTimeout(() => {
        isProcessing = false;
        resultDiv.className = 'idle';
        resultDiv.textContent = 'Point camera at QR code';
      }, 2500);
    }
  </script>
</body>
</html>
